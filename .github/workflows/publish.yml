name: Publish NuGet Package

on:
  workflow_run:
    workflows: ["Unit Tests"]
    types:
    - completed

permissions:
  id-token: write
  contents: read

jobs:
  build-package:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - name: Setup .NET
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: |
          8.0
          9.0
          10.0
          11.0
    - name: Restore dependencies
      run: dotnet restore
    - name: Build project (release)
      run: dotnet build --configuration Release --no-restore
    - name: Create package
      run: dotnet pack --configuration Release --no-build
    - name: Upload built package
      uses: actions/upload-artifact@v7
      with:
        name: package
        path: AdventOfCode.Common/bin/Release/AndrewFreemantle.AdventOfCode.Common.*.nupkg

  publish-package-to-github:
    needs: build-package
    runs-on: ubuntu-latest
    steps:
    - name: Add GitHub NuGet source
      run: dotnet nuget add source --username AndrewFreemantle --password ${{ secrets.GITHUB_TOKEN }} --store-password-in-clear-text --name github "https://nuget.pkg.github.com/AndrewFreemantle/index.json"
    - name: Download built package
      uses: actions/download-artifact@v8
      with:
        name: package
    - name: Publish package to GitHub
      run: dotnet nuget push "AndrewFreemantle.AdventOfCode.Common.*.nupkg" --source github --skip-duplicate

  publish-package-to-nuget:
    needs: build-package
    runs-on: ubuntu-latest
    environment: public
    steps:
    - name: Download built package
      uses: actions/download-artifact@v8
      with:
        name: package
    - name: Publish to NuGet - login (OIDC → temp API key)
      uses: NuGet/login@v1
      id: login
      with:
        user: ${{ secrets.NUGET_USER }}
    - name: NuGet push
      run: dotnet nuget push "AndrewFreemantle.AdventOfCode.Common.*.nupkg" --api-key ${{steps.login.outputs.NUGET_API_KEY}} --source https://api.nuget.org/v3/index.json
